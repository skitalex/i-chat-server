x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "250m"
    max-file: "4"

services:
  postgres:
    image: postgres:16
    shm_size: 2g
    container_name: postgres-chat-container
    command: postgres -c 'max_connections=500'
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - chat_network
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  migrator:
    container_name: migrator-chat-container
    build:
      context: .
      dockerfile: docker/migrations.Dockerfile
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MIGRATION_DSN=host=postgres port=5432 dbname=${POSTGRES_DB:-db} user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD} sslmode=disable
      - MIGRATION_DIR=./migrations
    networks:
      - chat_network
  redis:
    image: "redis/redis-stack:7.4.0-v0"
    container_name: redis-chat-container
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    networks:
      - chat_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  chat-server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: chat-server-container
    ports:
      - "127.0.0.1:${HTTP_PORT_CHAT_EXPOSE:-8181}:${HTTP_PORT_CHAT:-8181}"
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - chat_network
    environment:
      - HTTP_HOST_CHAT=${HTTP_HOST_CHAT:-127.0.0.1}
      - HTTP_PORT_CHAT=${HTTP_PORT_CHAT:-8181}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_DB=${REDIS_DB:-0}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_SSL=${POSTGRES_SSL:-disable}

networks:
  chat_network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
